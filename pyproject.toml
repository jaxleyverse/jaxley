[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Jaxley"
version = "0.14.0"
description = "Differentiable neuron simulations."
authors = [
    { name = "jaxleyverse", email = "jaxleyverse@gmail.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Adaptive Technologies",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    """License :: OSI Approved :: Apache Software License""",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.14"
readme = "README.md"
keywords = ["neuroscience", "biophysics", "simulator", "jax"]
dependencies = [
    "jax",
    "matplotlib",
    "numpy",
    "pandas>=2.2.0",
    "tridiax",
    "networkx>=3.3",
]

[project.optional-dependencies]
doc = [
    "jupyter_contrib_nbextensions",
    "notebook <= 6.4.12",
    "traitlets <= 5.9.0",
    "ipython <= 8.9.0",
    "mkdocs",
    "mkdocs-material",
    "markdown-include",
    "mkdocs-redirects",
    "mkdocstrings[python]>=0.18",
    "mike",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_autodoc_typehints",
    "sphinx-math-dollar",
    "sphinx-design",
    "myst-nb",
    "jupytext",
    "optax",
    "sphinx-book-theme",
]
dev = [
    "black",
    "isort",
    # TODO before the 1.0.0 release: replace with `jaxley-mech>=1.0` once jaxley-mech
    # 1.0 is on PyPI. PyPI rejects packages with direct URL dependencies.
    "jaxley-mech @ git+https://github.com/jaxleyverse/jaxley-mech.git@v1.0.0",
    "neuron",
    "pytest",
    "pytest-xdist",
    "pyright",
    "optax",
    "jupyter",
]

[tool.pytest.ini_options]
# 4 workers by default (`-n 0` runs serially). `pytest -m perf` overrides the marker
# filter and runs serially (see `tests/conftest.py`).
addopts = "-m 'not perf' -n 4"
markers = [
    "slow: marks tests as slow (T > 10s)",
    "perf: performance benchmarks, local only (run with `pytest -m perf`)",
]

[tool.isort]
profile = "black"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
